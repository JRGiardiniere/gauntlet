<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gauntlet Dossier</title>
<style>
  :root {
    color-scheme: light dark;
    --color-background-primary: light-dark(#ffffff, #161618);
    --color-background-secondary: light-dark(#f4f4f5, #232326);
    --color-text-primary: light-dark(#18181b, #f4f4f5);
    --color-text-secondary: light-dark(#5f5f69, #a1a1aa);
    --color-text-tertiary: light-dark(#8a8a93, #71717a);
    --color-text-danger: light-dark(#c0262d, #f87171);
    --color-text-warning: light-dark(#a35c00, #fbbf24);
    --color-text-info: light-dark(#1f5fd1, #7aa7ff);
    --color-text-success: light-dark(#1d7a46, #4ade80);
    --color-border-primary: light-dark(#e4e4e7, #2e2e33);
    --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-ligatures: none;
    --font-text-xs-size: 12px;
    --font-text-sm-size: 13px;
    --font-text-md-size: 14px;
    --font-heading-sm-size: 16px;
    --border-radius-sm: 4px;
    --border-radius-md: 8px;
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--color-background-primary);
    color: var(--color-text-primary);
    font-family: var(--font-sans);
    font-size: var(--font-text-md-size);
    line-height: 1.5;
    overflow-wrap: anywhere;
  }
  main { padding: 16px; }
  p { margin: 0; }
  .muted { color: var(--color-text-secondary); }
  .tint { --tone: var(--color-text-secondary); color: var(--tone); background: color-mix(in srgb, var(--tone) 13%, transparent); }
  .t-confirmed, .t-P1 { --tone: var(--color-text-danger); }
  .t-plausible, .t-P2 { --tone: var(--color-text-warning); }
  .t-judgment { --tone: var(--color-text-info); }
  .t-undecided, .t-P3, .t-none { --tone: var(--color-text-tertiary); }

  header { padding-bottom: 14px; border-bottom: 1px solid var(--color-border-primary); }
  .eyebrow { font-size: var(--font-text-xs-size); color: var(--color-text-tertiary); letter-spacing: 0.06em; text-transform: uppercase; }
  .target { margin-top: 2px; font-size: var(--font-heading-sm-size); font-weight: 600; }
  .run { font-family: var(--font-mono); font-size: var(--font-text-xs-size); color: var(--color-text-tertiary); }
  .tally { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 12px; }
  .chip { padding: 6px 8px; border-radius: var(--border-radius-md); line-height: 1.25; overflow-wrap: normal; }
  .chip b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .chip span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--font-text-xs-size); }
  .chip.zero { --tone: var(--color-text-tertiary); }

  .gaps { margin-top: 14px; padding: 10px 12px; border-radius: var(--border-radius-md); border-left: 3px solid var(--tone); }
  .gaps { --tone: var(--color-text-warning); background: color-mix(in srgb, var(--tone) 10%, transparent); }
  .gaps strong { color: var(--tone); }
  .gaps ul { margin: 4px 0 0; padding-left: 18px; }

  section { margin-top: 20px; }
  h2 { display: flex; align-items: center; gap: 8px; margin: 0 0 4px; font-size: var(--font-text-sm-size); font-weight: 600; }
  .pill { padding: 1px 8px; border-radius: 999px; font-size: var(--font-text-xs-size); font-weight: 700; }
  .count { color: var(--color-text-tertiary); font-weight: 500; }
  ul.entries { list-style: none; margin: 0; padding: 0; }
  .entries li { padding: 9px 0; border-top: 1px solid var(--color-border-primary); }
  .entries li:first-child { border-top: 0; }
  .t-P1 .entries { padding-left: 10px; border-left: 2px solid color-mix(in srgb, var(--color-text-danger) 55%, transparent); }
  .meta { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .badge { flex: none; padding: 0 7px; border-radius: var(--border-radius-sm); font-size: var(--font-text-xs-size); font-weight: 600; }
  .location { min-width: 0; font-family: var(--font-mono); font-size: var(--font-text-xs-size); color: var(--color-text-tertiary); }
  .summary { margin-top: 3px; }
  .t-P3 .summary, .t-none .summary { color: var(--color-text-secondary); }
  code { padding: 0 4px; border-radius: var(--border-radius-sm); background: var(--color-background-secondary); font-family: var(--font-mono); font-size: 0.9em; }

  .state { margin-top: 16px; padding: 14px; border-radius: var(--border-radius-md); background: var(--color-background-secondary); }
  .state.error { color: var(--color-text-danger); white-space: pre-wrap; }
  .state.clean strong { color: var(--color-text-success); }
  footer { margin-top: 20px; padding-top: 10px; border-top: 1px solid var(--color-border-primary); font-size: var(--font-text-xs-size); color: var(--color-text-tertiary); }
  footer .path { font-family: var(--font-mono); }
</style>
</head>
<body>
<main>
  <div id="view"><p class="state muted">Waiting for the Dossier…</p></div>
  <footer><div id="source"></div><div id="host">Connecting to host…</div></footer>
</main>
<script>
(() => {
  "use strict"
  const view = document.getElementById("view")
  const hostLine = document.getElementById("host")
  const sourceLine = document.getElementById("source")
  const pending = new Map()
  let nextId = 1

  const post = (message) => window.parent.postMessage({ jsonrpc: "2.0", ...message }, "*")
  const notify = (method, params) => post({ method, params })
  const request = (method, params) => new Promise((resolve, reject) => {
    const id = nextId++
    pending.set(id, { resolve, reject })
    post({ id, method, params })
  })

  const el = (tag, className, ...children) => {
    const node = document.createElement(tag)
    if (className) node.className = className
    node.append(...children)
    return node
  }

  // Backtick spans become <code>; everything else stays plain text.
  const withCode = (text) => String(text).split("`").map((part, index) =>
    index % 2 === 1 && part !== "" ? el("code", "", part) : part)

  const showState = (className, ...children) => view.replaceChildren(el("p", `state ${className}`, ...children))
  const showError = (text) => showState("error", text)

  const applyContext = (context) => {
    if (!context) return
    if (context.theme === "light" || context.theme === "dark") {
      document.documentElement.dataset.theme = context.theme
    }
    const variables = context.styles && context.styles.variables
    if (variables) {
      for (const [name, value] of Object.entries(variables)) {
        if (typeof value === "string") document.documentElement.style.setProperty(name, value)
      }
    }
  }

  const TAG_LABELS = { confirmed: "confirmed", judgment: "kept", plausible: "plausible", undecided: "undecided" }
  const TALLY = [["confirmed", "confirmed"], ["kept", "judgment"], ["plausible", "plausible"], ["undecided", "undecided"]]
  const PRIORITIES = [["P1", "P1"], ["P2", "P2"], ["P3", "P3"], [undefined, "No priority"]]

  const render = (digest) => {
    const tally = el("div", "tally", ...TALLY.map(([key, tag]) => {
      const count = Number(digest.tally[key]) || 0
      return el("div", `chip tint t-${tag}${count === 0 ? " zero" : ""}`, el("b", "", String(count)), el("span", "", key))
    }))
    const parts = [el("header", "",
      el("div", "eyebrow", "Gauntlet Dossier"),
      el("div", "target", digest.target),
      el("div", "run", digest.runId),
      tally)]

    if (digest.coverageGaps.length > 0) {
      parts.push(el("div", "gaps",
        el("strong", "", `Coverage gaps (${digest.coverageGaps.length})`),
        el("ul", "", ...digest.coverageGaps.map((gap) => el("li", "", gap)))))
    }

    if (digest.entries.length === 0) {
      parts.push(el("p", "state clean", el("strong", "", "No findings. "), "Nothing was confirmed, kept or left unresolved."))
    }
    for (const [priority, heading] of PRIORITIES) {
      const group = digest.entries.filter((entry) => entry.priority === priority)
      if (group.length === 0) continue
      const tone = priority || "none"
      parts.push(el("section", `t-${tone}`,
        el("h2", "", el("span", `pill tint t-${tone}`, heading), el("span", "count", `${group.length}`)),
        el("ul", "entries", ...group.map((entry) => el("li", "",
          el("div", "meta",
            el("span", `badge tint t-${entry.tag}`, TAG_LABELS[entry.tag] || entry.tag),
            el("span", "location", entry.location)),
          el("p", "summary", ...withCode(entry.summary)))))))
    }

    view.replaceChildren(...parts)
    sourceLine.replaceChildren(el("span", "path", digest.dossierMarkdown))
  }

  const onToolResult = (result) => {
    const text = result && Array.isArray(result.content) && result.content[0] && result.content[0].text
    if (result && result.isError) return showError(text || "show_dossier failed.")
    let digest = result && result.structuredContent
    if (!digest && typeof text === "string") {
      try { digest = JSON.parse(text) } catch { digest = undefined }
    }
    if (!digest || !digest.tally || !Array.isArray(digest.entries)) return showError("The tool result is not a Dossier digest.")
    render(digest)
  }

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return
    const message = event.data
    if (!message || message.jsonrpc !== "2.0") return

    if (message.id !== undefined && message.method === undefined) {
      const waiter = pending.get(message.id)
      if (!waiter) return
      pending.delete(message.id)
      if (message.error) waiter.reject(new Error(message.error.message || "host error"))
      else waiter.resolve(message.result)
      return
    }

    if (message.id !== undefined) {
      if (message.method === "ping" || message.method === "ui/resource-teardown") post({ id: message.id, result: {} })
      else post({ id: message.id, error: { code: -32601, message: `Method not found: ${message.method}` } })
      return
    }

    switch (message.method) {
      case "ui/notifications/tool-input": {
        const runDir = message.params && message.params.arguments && message.params.arguments.run_dir
        if (typeof runDir === "string") showState("muted", `Waiting for the Dossier in ${runDir}…`)
        break
      }
      case "ui/notifications/tool-result":
        onToolResult(message.params)
        break
      case "ui/notifications/tool-cancelled":
        showError(`show_dossier was cancelled${message.params && message.params.reason ? `: ${message.params.reason}` : "."}`)
        break
      case "ui/notifications/host-context-changed":
        applyContext(message.params)
        break
    }
  })

  let lastSize = ""
  const reportSize = () => {
    // The body's own box, so the page can shrink below an initial iframe height.
    const box = document.body.getBoundingClientRect()
    const width = Math.ceil(box.width)
    const height = Math.ceil(box.height)
    const size = `${width}x${height}`
    if (size === lastSize) return
    lastSize = size
    notify("ui/notifications/size-changed", { width, height })
  }

  request("ui/initialize", {
    protocolVersion: "2026-01-26",
    appInfo: { name: "gauntlet-dossier", version: "0.1.0" },
    appCapabilities: { availableDisplayModes: ["inline"] },
  }).then((result) => {
    applyContext(result && result.hostContext)
    const info = (result && result.hostInfo) || {}
    hostLine.textContent = `Rendered by ${info.name || "unknown host"} ${info.version || ""}`.trim()
    notify("ui/notifications/initialized", {})
    new ResizeObserver(reportSize).observe(document.body)
    reportSize()
  }, (error) => {
    hostLine.textContent = `ui/initialize failed: ${error.message}`
  })
})()
</script>
</body>
</html>
