<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gauntlet Dossier</title>
<style>
  /* Fallbacks only: a host's styles.variables replace these. */
  :root {
    color-scheme: light dark;
    --color-background-primary: light-dark(#ffffff, #161618);
    --color-background-secondary: light-dark(#f4f4f5, #232326);
    --color-text-primary: light-dark(#18181b, #f4f4f5);
    --color-text-secondary: light-dark(#5b5b66, #a1a1aa);
    --color-text-danger: light-dark(#b91c1c, #f87171);
    --color-text-warning: light-dark(#a14a06, #fbbf24);
    --color-text-info: light-dark(#1d4ed8, #60a5fa);
    --color-border-primary: light-dark(#e4e4e7, #2e2e33);
    --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--color-background-primary);
    color: var(--color-text-primary);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.5;
  }
  ::selection { background: color-mix(in srgb, var(--color-ring-primary, var(--color-text-info)) 30%, transparent); }
  main { padding: 16px; }
  p, ul, h1, h2 { margin: 0; }
  ul { padding: 0; list-style: none; }

  h1 { font-size: 18px; font-weight: 600; line-height: 1.3; text-wrap: balance; }
  .tally { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 4px; font-size: 13px; color: var(--color-text-secondary); }
  .tally b { color: var(--color-text-primary); font-weight: 600; font-variant-numeric: tabular-nums; }

  h2 {
    margin: 28px 0 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--color-border-primary);
    font-size: 13px;
    font-weight: 600;
    line-height: 1.3;
  }
  h2 .count { margin-left: 6px; color: var(--color-text-secondary); font-weight: 400; font-variant-numeric: tabular-nums; }
  .p1 h2 { color: var(--color-text-danger); }
  .p2 h2, .gaps h2 { color: var(--color-text-warning); }
  .gaps ul { display: grid; gap: 4px; }

  .entries { display: grid; gap: 12px; }
  .entries li {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "summary summary" "location status";
    align-items: baseline;
    gap: 2px 12px;
  }
  .summary { grid-area: summary; max-width: 72ch; text-wrap: pretty; overflow-wrap: break-word; }
  .location {
    grid-area: location;
    min-width: 0;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--color-text-secondary);
    overflow-wrap: anywhere;
  }
  .status { grid-area: status; font-size: 12px; color: var(--color-text-secondary); white-space: nowrap; }
  .status.caution { color: var(--color-text-warning); }
  @media (min-width: 34rem) {
    /* The location shares the summary's 72ch right edge. */
    .entries li {
      grid-template-columns: 5.5rem minmax(0, 1fr);
      grid-template-areas: "status summary" ". location";
      max-width: calc(5.5rem + 12px + 72ch);
    }
  }

  code {
    padding: 1px 4px;
    border-radius: 4px;
    /* T3's muted surface is within 1% of its canvas: a touch of the text
       colour keeps the span visible on any host. */
    background: color-mix(in srgb, var(--color-text-primary) 7%, var(--color-background-tertiary, var(--color-background-secondary)));
    font-family: var(--font-mono);
    font-size: 0.92em;
    font-variant-ligatures: none;
  }

  .state { color: var(--color-text-secondary); }
  .error { color: var(--color-text-danger); white-space: pre-wrap; }
  .clean span { color: var(--color-text-secondary); }

  footer {
    margin-top: 28px;
    padding-top: 8px;
    border-top: 1px solid var(--color-border-primary);
    font-size: 12px;
    color: var(--color-text-secondary);
    overflow-wrap: anywhere;
  }
  footer[hidden] { display: none; }
  .path { font-family: var(--font-mono); font-variant-ligatures: none; }
</style>
</head>
<body>
<main>
  <div id="view"><p class="state">Waiting for the Dossier…</p></div>
  <footer id="footer" hidden></footer>
</main>
<script>
(() => {
  "use strict"
  const view = document.getElementById("view")
  const footer = document.getElementById("footer")
  const pending = new Map()
  let nextId = 1

  const post = (message) => window.parent.postMessage({ jsonrpc: "2.0", ...message }, "*")
  const notify = (method, params) => post({ method, params })
  const request = (method, params) => new Promise((resolve, reject) => {
    const id = nextId++
    pending.set(id, { resolve, reject })
    post({ id, method, params })
  })

  const el = (tag, className, ...children) => {
    const node = document.createElement(tag)
    if (className) node.className = className
    node.append(...children)
    return node
  }

  // Backtick spans become <code>; everything else stays plain text.
  const withCode = (text) => String(text).split("`").map((part, index) =>
    index % 2 === 1 && part !== "" ? el("code", "", part) : part)

  const showState = (className, ...children) => view.replaceChildren(el("p", className, ...children))
  const showError = (text) => showState("error", text)

  const showFooter = (...children) => {
    footer.replaceChildren(...children)
    footer.hidden = false
  }

  const applyContext = (context) => {
    if (!context) return
    if (context.theme === "light" || context.theme === "dark") {
      document.documentElement.dataset.theme = context.theme
    }
    const variables = context.styles && context.styles.variables
    if (variables) {
      for (const [name, value] of Object.entries(variables)) {
        if (typeof value === "string") document.documentElement.style.setProperty(name, value)
      }
    }
  }

  const STATUS = { confirmed: "confirmed", judgment: "kept", plausible: "plausible", undecided: "undecided" }
  const CAUTION = new Set(["plausible", "undecided"])
  const TALLY = ["confirmed", "kept", "plausible", "undecided"]
  const PRIORITIES = [["P1", "P1", "p1"], ["P2", "P2", "p2"], ["P3", "P3", "p3"], [undefined, "No priority", "none"]]

  const heading = (label, count) => el("h2", "", label, el("span", "count", String(count)))

  const entry = (item) => el("li", "",
    el("p", "summary", ...withCode(item.summary)),
    el("span", "location", item.location),
    el("span", CAUTION.has(item.tag) ? "status caution" : "status", STATUS[item.tag] || item.tag))

  const render = (digest) => {
    const header = el("header", "", el("h1", "", digest.target))
    const counts = TALLY.filter((key) => Number(digest.tally[key]) > 0)
    if (counts.length > 0) {
      header.append(el("p", "tally", ...counts.map((key) =>
        el("span", "", el("b", "", String(digest.tally[key])), ` ${key}`))))
    }
    const parts = [header]

    if (digest.coverageGaps.length > 0) {
      parts.push(el("section", "gaps",
        heading("Coverage gaps", digest.coverageGaps.length),
        el("ul", "", ...digest.coverageGaps.map((gap) => el("li", "", gap)))))
    }

    if (digest.entries.length === 0) {
      parts.push(el("p", "clean", "No findings.", el("span", "", " Nothing was confirmed, kept or left unresolved.")))
    }
    for (const [priority, label, className] of PRIORITIES) {
      const group = digest.entries.filter((item) => item.priority === priority)
      if (group.length === 0) continue
      parts.push(el("section", className, heading(label, group.length), el("ul", "entries", ...group.map(entry))))
    }

    view.replaceChildren(...parts)
    showFooter("Full Dossier: ", el("span", "path", digest.dossierMarkdown))
  }

  const onToolResult = (result) => {
    const text = result && Array.isArray(result.content) && result.content[0] && result.content[0].text
    if (result && result.isError) return showError(text || "show_dossier failed.")
    let digest = result && result.structuredContent
    if (!digest && typeof text === "string") {
      try { digest = JSON.parse(text) } catch { digest = undefined }
    }
    if (!digest || !digest.tally || !Array.isArray(digest.entries)) return showError("The tool result is not a Dossier digest.")
    render(digest)
  }

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return
    const message = event.data
    if (!message || message.jsonrpc !== "2.0") return

    if (message.id !== undefined && message.method === undefined) {
      const waiter = pending.get(message.id)
      if (!waiter) return
      pending.delete(message.id)
      if (message.error) waiter.reject(new Error(message.error.message || "host error"))
      else waiter.resolve(message.result)
      return
    }

    if (message.id !== undefined) {
      if (message.method === "ping" || message.method === "ui/resource-teardown") post({ id: message.id, result: {} })
      else post({ id: message.id, error: { code: -32601, message: `Method not found: ${message.method}` } })
      return
    }

    switch (message.method) {
      case "ui/notifications/tool-input": {
        const runDir = message.params && message.params.arguments && message.params.arguments.run_dir
        if (typeof runDir === "string") showState("state", `Waiting for the Dossier in ${runDir}…`)
        break
      }
      case "ui/notifications/tool-result":
        onToolResult(message.params)
        break
      case "ui/notifications/tool-cancelled":
        showError(`show_dossier was cancelled${message.params && message.params.reason ? `: ${message.params.reason}` : "."}`)
        break
      case "ui/notifications/host-context-changed":
        applyContext(message.params)
        break
    }
  })

  let lastSize = ""
  const reportSize = () => {
    // The body's own box, so the page can shrink below an initial iframe height.
    const box = document.body.getBoundingClientRect()
    const width = Math.ceil(box.width)
    const height = Math.ceil(box.height)
    const size = `${width}x${height}`
    if (size === lastSize) return
    lastSize = size
    notify("ui/notifications/size-changed", { width, height })
  }

  request("ui/initialize", {
    protocolVersion: "2026-01-26",
    appInfo: { name: "gauntlet-dossier", version: "0.1.0" },
    appCapabilities: { availableDisplayModes: ["inline"] },
  }).then((result) => {
    applyContext(result && result.hostContext)
    notify("ui/notifications/initialized", {})
    new ResizeObserver(reportSize).observe(document.body)
    reportSize()
  }, (error) => {
    showFooter(el("span", "error", `ui/initialize failed: ${error.message}`))
  })
})()
</script>
</body>
</html>
