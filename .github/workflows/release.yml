# Tag-driven releases: pushing v<major>.<minor>.<patch> builds one binary per
# platform on its own native runner, smoke-tests each, and publishes them on a
# GitHub release. The tag is the single source of truth for the version —
# scripts/bundle.ts bakes it in as a define, and package.json's placeholder
# version is never consulted.
#
# A pull request that touches the build, or a manual run, builds and
# smoke-tests all four binaries and publishes nothing.
name: release

# Exact numeric tags only: the updater's probe parses nothing else, so a
# v1.2.3-rc.1 or vnext tag would publish a release every binary ignores.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/bundle.ts
      - scripts/compile.ts
      - scripts/compile-smoke*.ts
      - package.json
      - bun.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-15
            target: bun-darwin-arm64
            asset: gauntlet-darwin-arm64
          - runner: macos-15-intel
            target: bun-darwin-x64
            asset: gauntlet-darwin-x64
          - runner: ubuntu-24.04
            target: bun-linux-x64
            asset: gauntlet-linux-x64
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            asset: gauntlet-linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      GAUNTLET_TARGET: ${{ matrix.target }}
      GAUNTLET_OUTFILE: dist/${{ matrix.asset }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Bundle
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then export GAUNTLET_VERSION="${GITHUB_REF_NAME#v}"; fi
          bun scripts/bundle.ts
      - name: Offline compile smoke
        run: bun scripts/compile-smoke.ts
      # Only the tag push being released: any other build's lookup can find a
      # newer release and replace itself with it.
      - name: Verify self-update lookup
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: sh scripts/upgrade-compiled.test.sh "$GAUNTLET_OUTFILE"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: [build]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Package agent skill
        run: cp .agents/skills/gauntlet-cli/SKILL.md assets/gauntlet-skill.md
      # docs/release-notes/<tag>.md, when a release has one, goes above the
      # generated notes.
      - run: |
          notes="docs/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; fi
          gh release create "$GITHUB_REF_NAME" assets/* --generate-notes "$@" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
